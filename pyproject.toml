[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asus-dearmour"
version = "1.0.0"
description = "Strip bloated ASUS driver installer wrappers into pure, bare-metal INF/SYS/CAT driver repositories with zero telemetry and 1-click batch deployment."
readme = "README.md"
authors = [{ name = "mustafakorkunc" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Utilities"
]
keywords = ["asus", "driver", "extractor", "inf", "pnputil", "clean-install", "tuf", "rog", "dearmour"]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
dearmour = "asus_driver_extractor.cli:main"
dearmour-gui = "asus_driver_extractor.gui:launch_gui"
asus-unpack = "asus_driver_extractor.cli:main"
ade = "asus_driver_extractor.cli:main"
ade-gui = "asus_driver_extractor.gui:launch_gui"

[project.urls]
Homepage = "https://github.com/mustafakorkunc/asus-dearmour"
Issues = "https://github.com/mustafakorkunc/asus-dearmour/issues"
Repository = "https://github.com/mustafakorkunc/asus-dearmour.git"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
